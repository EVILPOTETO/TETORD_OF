name: Build TETORD Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build TETORD
        run: npm run build:release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TETORD-4.2.0-Windows
          path: |
            dist/TETORD-Setup-4.2.0-x64.exe
            dist/TETORD-4.2.0-x64.exe
